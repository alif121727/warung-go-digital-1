<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" role="img" aria-label="Karakter QR code tersenyum dan melambaikan tangan">
  <defs>
    <radialGradient id="qrGlow" cx="50%" cy="48%" r="62%">
      <stop offset="0%" stop-color="#3ba55d" stop-opacity=".28"/>
      <stop offset="64%" stop-color="#f5a524" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="qrBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3324"/>
      <stop offset="100%" stop-color="#0d1a12"/>
    </linearGradient>
      <radialGradient id="__PLATE" cx="38%" cy="28%" r="86%">
      <stop offset="0%" stop-color="#24503a"/>
      <stop offset="58%" stop-color="#16301f"/>
      <stop offset="100%" stop-color="#0d1a12"/>
    </radialGradient>
    <linearGradient id="__RIM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5a524"/>
      <stop offset="55%" stop-color="#e06b3c"/>
      <stop offset="100%" stop-color="#3ba55d"/>
    </linearGradient>
  </defs>

  <circle cx="120" cy="120" r="113" fill="url(#__PLATE)" stroke="url(#__RIM)" stroke-width="3"/>
  <circle cx="120" cy="120" r="103" fill="none" stroke="#0d1a12" stroke-opacity=".10" stroke-width="1.6"/>

  <circle cx="120" cy="120" r="96" fill="url(#qrGlow)" opacity=".55"/>

  <rect x="93" y="204" width="20" height="20" rx="9" fill="#132419"/>
  <rect x="127" y="204" width="20" height="20" rx="9" fill="#132419"/>

  <!-- antena -->
  <path d="M120 60V44" stroke="#0d1a12" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="120" cy="38" r="8" fill="#f5a524" stroke="#0d1a12" stroke-width="3.2"/>

  <!-- badan QR -->
  <rect x="70" y="60" width="100" height="100" rx="22" fill="url(#qrBody)" stroke="#0d1a12" stroke-width="3.6"/>

  <!-- pola QR -->
  <g fill="#f6f0e2">
    <rect x="82" y="72" width="18" height="18" rx="4"/>
    <rect x="140" y="72" width="18" height="18" rx="4"/>
    <rect x="82" y="130" width="18" height="18" rx="4"/>
  </g>
  <g fill="#f5a524">
    <rect x="88" y="78" width="6" height="6" rx="1.6"/>
    <rect x="146" y="78" width="6" height="6" rx="1.6"/>
    <rect x="88" y="136" width="6" height="6" rx="1.6"/>
  </g>
  <g fill="#f6f0e2">
    <rect x="108" y="72" width="8" height="8" rx="2"/>
    <rect x="122" y="72" width="8" height="8" rx="2"/>
    <rect x="108" y="86" width="8" height="8" rx="2"/>
    <rect x="136" y="98" width="8" height="8" rx="2"/>
    <rect x="122" y="98" width="8" height="8" rx="2"/>
    <rect x="108" y="130" width="8" height="8" rx="2"/>
    <rect x="122" y="130" width="8" height="8" rx="2"/>
    <rect x="136" y="130" width="8" height="8" rx="2"/>
    <rect x="150" y="116" width="8" height="8" rx="2"/>
    <rect x="136" y="144" width="8" height="8" rx="2"/>
    <rect x="122" y="144" width="8" height="8" rx="2"/>
  </g>

  <!-- mata -->
  <circle cx="100" cy="104" r="5" fill="#f6f0e2"/>
  <circle cx="101.6" cy="102.4" r="1.8" fill="#0d1a12"/>
  <circle cx="140" cy="104" r="5" fill="#f6f0e2"/>
  <circle cx="141.6" cy="102.4" r="1.8" fill="#0d1a12"/>

  <!-- senyum -->
  <path d="M104 116c5 6 12 6 17 0" stroke="#f5a524" stroke-width="3.4" stroke-linecap="round"/>

  <!-- tangan melambai -->
  <path d="M70 132c-10 4-16 12-17 22" stroke="#0d1a12" stroke-width="11" stroke-linecap="round"/>
  <circle cx="52" cy="158" r="10" fill="#f6f0e2" stroke="#0d1a12" stroke-width="3.2"/>
  <path d="M170 132c10 4 16 12 17 22" stroke="#0d1a12" stroke-width="11" stroke-linecap="round"/>
  <circle cx="188" cy="158" r="10" fill="#f6f0e2" stroke="#0d1a12" stroke-width="3.2"/>

  <path d="M62 96l3 8 8 3-8 3-3 8-3-8-8-3 8-3 3-8Z" fill="#f5a524"/>
  <circle cx="186" cy="86" r="4" fill="#3ba55d"/>
</svg>
