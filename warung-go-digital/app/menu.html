<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu Digital — Warung Go Digital</title>
<meta name="theme-color" content="#0d1a12">
<!-- Alamat server sinkron (opsional). Bila diisi, menu dibaca dari
     /api/menu?id=<id> server itu sehingga terbuka di HP mana pun. Kosongkan
     bila tidak memakai server sinkron. -->
<meta name="wgd-menu-server" content="">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f5a524'/%3E%3Ctext x='16' y='23' font-size='18' font-weight='bold' text-anchor='middle' fill='%230d1a12' font-family='sans-serif'%3EW%3C/text%3E%3C/svg%3E">
<!-- Agar bisa dipasang sebagai aplikasi di HP -->
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../ikon/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Warung Go">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    --ink: #0d1a12; --amber: #f5a524; --krem: #f6f0e2;
    --wa: #25d366; --leaf: #3ba55d;
    --t1: #0d1a12; --t2: #4a574f; --t3: #646d66;
    --card: #fff; --line: #e6e2d8;
    --r: 14px; --e: cubic-bezier(.22,1,.36,1);
  }
  body {
    margin: 0; background: #f7f5f0; color: var(--t1);
    font-family: Inter, system-ui, sans-serif; font-size: 14.5px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  h1, h2, h3 { font-family: 'Bricolage Grotesque', sans-serif; margin: 0; letter-spacing: -.02em; line-height: 1.15; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 90px; }

  /* ── Kepala warung ── */
  .hero {
    background: var(--ink); color: #fff; padding: 30px 24px 66px;
    padding-top: calc(30px + env(safe-area-inset-top, 0px));
    position: relative; overflow: hidden;
  }
  .hero::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(500px 300px at 15% 0%, rgba(245,165,36,.2), transparent 70%);
  }
  .hero__in { max-width: 720px; margin: 0 auto; position: relative; }
  .hero__brand {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--amber); margin-bottom: 12px;
  }
  .hero h1 { font-size: 30px; font-weight: 800; }
  .hero__meta { color: #b6c6bc; font-size: 13px; margin-top: 7px; }
  .hero__badges { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 15px; }
  .pill {
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.16);
    padding: 5px 12px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .pill--amber { background: rgba(245,165,36,.2); border-color: rgba(245,165,36,.35); color: #ffd88a; }

  /* ── Kartu info ── */
  .kartu {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 20px; margin-top: -46px; position: relative; z-index: 2;
    box-shadow: 0 12px 34px rgba(13,26,18,.1);
  }
  .kartu__row { display: flex; gap: 11px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 18px; border-radius: 11px; border: 1px solid var(--line);
    background: var(--card); font-size: 13.5px; font-weight: 700; cursor: pointer;
    text-decoration: none; color: inherit; transition: all .15s var(--e); flex: 1; min-width: 140px;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(13,26,18,.1); }
  .btn--wa { background: var(--wa); border-color: var(--wa); color: #06301a; }
  .btn--ink { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn svg { width: 17px; height: 17px; }

  /* ── Menu ── */
  .judul {
    display: flex; align-items: center; gap: 11px; margin: 30px 0 14px;
  }
  .judul h2 { font-size: 18px; }
  .judul span {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--t3);
    background: #ece8de; padding: 3px 9px; border-radius: 999px;
  }
  .judul::after { content: ''; flex: 1; height: 1px; background: var(--line); }

  .item {
    display: flex; gap: 14px; padding: 14px; background: var(--card);
    border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 10px;
    transition: all .16s var(--e);
  }
  .item:hover { box-shadow: 0 6px 18px rgba(13,26,18,.07); transform: translateY(-1px); }
  /* Kemunculan berjenjang: elegan, dan langsung berhenti bila pengguna
     meminta lebih sedikit gerak. */
  @keyframes itemNaik { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .item { animation: itemNaik .5s cubic-bezier(.22,1,.36,1) both; }
  @media (prefers-reduced-motion: reduce) {
    .item { animation: none; }
    .item:hover { transform: none; }
  }
  .item__gambar {
    width: 62px; height: 62px; border-radius: 11px; flex: none;
    background: linear-gradient(140deg, #e9e4d8, #d8d1c1);
    display: grid; place-items: center; overflow: hidden;
  }
  .item__gambar img { width: 100%; height: 100%; object-fit: cover; }
  .item__gambar svg { width: 24px; height: 24px; color: #a9a294; }
  .item__isi { flex: 1; min-width: 0; }
  .item__nama { font-weight: 700; font-size: 14.5px; font-family: 'Bricolage Grotesque', sans-serif; }
  .item__ket { font-size: 12.5px; color: var(--t2); margin-top: 2px; }
  .item__kanan { text-align: right; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; }
  .item__harga { font-weight: 800; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15.5px; white-space: nowrap; }
  .item__pesan {
    font-size: 11.5px; font-weight: 700; color: var(--wa); text-decoration: none;
    border: 1px solid rgba(37,211,102,.4); background: rgba(37,211,102,.1);
    padding: 4px 10px; border-radius: 999px; white-space: nowrap; margin-top: 7px;
    display: inline-flex; align-items: center; min-height: 34px;
  }

  .kosong { text-align: center; padding: 50px 20px; color: var(--t2); }
  .kosong svg { width: 40px; height: 40px; color: #c9c2b3; margin-bottom: 12px; }

  .foot {
    text-align: center; padding: 30px 20px; color: var(--t3); font-size: 11.5px;
    border-top: 1px solid var(--line); margin-top: 30px;
  }
  .foot b { color: var(--t2); font-family: 'JetBrains Mono', monospace; letter-spacing: .06em; }

  .wafloat {
    position: fixed; bottom: 18px; right: 18px; z-index: 50;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    background: var(--wa); color: #06301a; border-radius: 999px;
    padding: 13px 20px; font-weight: 700; font-size: 13.5px; text-decoration: none;
    display: flex; align-items: center; gap: 9px;
    box-shadow: 0 8px 26px rgba(37,211,102,.42);
  }
  .wafloat svg { width: 19px; height: 19px; }

  /* Area tekan lebih besar di perangkat sentuh */
  @media (pointer: coarse) {
    .btn { min-height: 46px; }
    .item__pesan { padding: 9px 14px; font-size: 12.5px; min-height: 40px; }
  }

  @media (max-width: 560px) {
    .hero h1 { font-size: 24px; }
    .hero { padding: 24px 18px 58px; padding-top: calc(24px + env(safe-area-inset-top, 0px)); }
    .kartu { padding: 16px; }
    .item { padding: 12px; gap: 11px; }
    .item__gambar { width: 52px; height: 52px; }
    .wafloat { left: 14px; right: 14px; justify-content: center; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero__in">
    <div class="hero__brand">Warung Go Digital</div>
    <h1 id="nama">Memuat menu…</h1>
    <div class="hero__meta" id="meta"></div>
    <div class="hero__badges" id="badges"></div>
  </div>
</div>

<div class="wrap">
  <div class="kartu">
    <div class="kartu__row">
      <a class="btn btn--wa" id="waPesan" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 01-12.6 7.4L3.5 20.5l1.7-4.8A8.5 8.5 0 1121 11.5z"/></svg>
        Pesan via WhatsApp
      </a>
      <a class="btn btn--ink" id="waMaps" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.5 7-11a7 7 0 10-14 0c0 5.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
        Lihat Lokasi
      </a>
    </div>
  </div>

  <div id="isiMenu"></div>

  <div class="foot">
    Menu digital oleh <b>WARUNG GO DIGITAL</b><br>
    Etalase digital untuk warung &amp; UMKM
  </div>
</div>

<a class="wafloat" id="waFloat" href="#">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 01-12.6 7.4L3.5 20.5l1.7-4.8A8.5 8.5 0 1121 11.5z"/></svg>
  Pesan Sekarang
</a>

<script src="store.js"></script>
<script>
(() => {
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rupiah = (n) => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
  const q = new URLSearchParams(location.search);
  const id = q.get('w');

  const elNama = document.getElementById('nama');
  const elMeta = document.getElementById('meta');
  const elBadges = document.getElementById('badges');
  const elIsi = document.getElementById('isiMenu');
  const btnPesan = document.getElementById('waPesan');
  const btnMaps = document.getElementById('waMaps');
  const btnFloat = document.getElementById('waFloat');

  const sembunyikanTombol = () => {
    btnPesan.style.display = 'none';
    btnMaps.style.display = 'none';
    btnFloat.style.display = 'none';
  };

  const pesanKosong = (judul, teks) => {
    elNama.textContent = judul;
    elMeta.textContent = teks;
    elIsi.innerHTML = `
      <div class="kosong">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11a1 1 0 001 1h14a1 1 0 001-1V9"/></svg>
        <h3>Menu tidak tersedia</h3>
        <p>${esc(teks)}</p>
      </div>`;
    sembunyikanTombol();
  };

  // Data menu publik. Urutan sumber:
  //   1. berkas terbit menu/<id>.json  — bisa dibuka HP mana pun (lewat QR)
  //   2. server sinkron /api/menu      — bila pengelola menjalankannya
  //   3. localStorage perangkat ini    — hanya untuk pengembangan di satu HP
  const muatBerkasTerbit = async () => {
    const url = new URL('../menu/' + encodeURIComponent(id) + '.json', location.href);
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  };

  const muatServerSinkron = async () => {
    const meta = document.querySelector('meta[name="wgd-menu-server"]');
    const alamat = ((meta && meta.content.trim()) ||
      localStorage.getItem('wgd-menu-server') || '').replace(/\/+$/, '');
    if (!alamat) throw new Error('server belum diatur');
    const r = await fetch(alamat + '/api/menu?id=' + encodeURIComponent(id), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  };

  const muatLokal = () => {
    if (typeof Store === 'undefined') throw new Error('tidak ada data lokal');
    Store.load();
    const w = Store.find('warung', id);
    if (!w) throw new Error('warung tidak ada di perangkat ini');
    return {
      wgd: 2, jenis: 'menu-publik',
      warung: {
        id: w.id, nama: w.nama, pemilik: w.pemilik, wa: w.wa, alamat: w.alamat,
        kategori: w.kategori, placeId: w.placeId, rating: w.ratingMaps, ulasan: w.jumlahUlasan,
      },
      menu: w.menu.map((m) => ({ nama: m.nama, harga: m.harga, kategori: m.kategori, ket: m.ket || '', foto: m.foto || null })),
    };
  };

  const gambar = (d) => {
    const w = d.warung || {};
    const daftarMenu = Array.isArray(d.menu) ? d.menu : [];

    document.title = 'Menu ' + w.nama + ' — Warung Go Digital';
    elNama.textContent = w.nama || 'Warung';
    elMeta.textContent = [w.kategori, w.alamat].filter(Boolean).join(' · ');

    const rating = Number(w.rating || 0);
    const bintang = rating ? '★'.repeat(Math.round(rating)) + '☆'.repeat(5 - Math.round(rating)) : '';
    elBadges.innerHTML = [
      rating ? `<span class="pill pill--amber">${bintang} ${rating.toFixed(1)}</span>` : '',
      w.ulasan ? `<span class="pill">${w.ulasan} ulasan Google</span>` : '',
      `<span class="pill">${daftarMenu.length} menu tersedia</span>`,
    ].filter(Boolean).join('');

    if (!daftarMenu.length) {
      pesanKosong('Menu belum diisi', 'Pemilik warung belum menambahkan daftar menu.');
      elNama.textContent = w.nama || 'Warung';
      return;
    }

    const waBase = w.wa ? 'https://wa.me/' + w.wa : '';
    const pesanUmum = encodeURIComponent('Halo ' + (w.pemilik || w.nama) + ', saya mau pesan dari menu ' + w.nama + '.');
    if (waBase) {
      btnPesan.href = waBase + '?text=' + pesanUmum;
      btnFloat.href = waBase + '?text=' + pesanUmum;
    } else {
      btnPesan.style.display = 'none';
      btnFloat.style.display = 'none';
    }
    btnMaps.href = w.placeId
      ? 'https://www.google.com/maps/place/?q=place_id:' + encodeURIComponent(w.placeId)
      : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent([w.nama, w.alamat].filter(Boolean).join(' '));

    const kelompok = {};
    for (const m of daftarMenu) (kelompok[m.kategori || 'Menu'] = kelompok[m.kategori || 'Menu'] || []).push(m);

    const ikonGambar = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="9" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg>`;

    let n = 0;
    elIsi.innerHTML = Object.entries(kelompok).map(([kategori, items]) => `
        <div class="judul"><h2>${esc(kategori)}</h2><span>${items.length} item</span></div>
        ${items.map((m) => {
          const pesan = waBase
            ? encodeURIComponent(`Halo ${w.pemilik || w.nama}, saya mau pesan *${m.nama}* (${rupiah(m.harga)}) dari ${w.nama}.`)
            : '';
          const geser = (n++ * 40);
          return `
            <div class="item" style="animation-delay:${geser}ms">
              <div class="item__gambar">${m.foto ? `<img src="${esc(m.foto)}" alt="${esc(m.nama)}" loading="lazy">` : ikonGambar}</div>
              <div class="item__isi">
                <div class="item__nama">${esc(m.nama)}</div>
                <div class="item__ket">${esc(m.ket || 'Dibuat segar saat dipesan')}</div>
              </div>
              <div class="item__kanan">
                <div class="item__harga">${rupiah(m.harga)}</div>
                ${waBase ? `<a class="item__pesan" href="${waBase}?text=${pesan}" target="_blank" rel="noopener">Pesan</a>` : ''}
              </div>
            </div>`;
        }).join('')}
      `).join('');
  };

  (async () => {
    if (!id) return pesanKosong('Menu tidak ditemukan', 'Kode warung tidak ada pada tautan ini.');
    try { return gambar(await muatBerkasTerbit()); } catch (e1) {
      try { return gambar(await muatServerSinkron()); } catch (e2) {
        try { return gambar(muatLokal()); } catch (e3) {
          return pesanKosong('Warung tidak ditemukan', 'Kode warung pada tautan tidak dikenali.');
        }
      }
    }
  })();
})();
</script>
<script src="../pasang.js"></script>
</body>
</html>
