<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu Digital — Warung Go Digital</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d1a12">
<!-- Alamat server sinkron (opsional). Bila diisi, menu dibaca dari
     /api/menu?id=<id> server itu sehingga terbuka di HP mana pun. Kosongkan
     bila tidak memakai server sinkron. -->
<meta name="wgd-menu-server" content="">
<link rel="icon" href="../logo/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="../logo/favicon.ico" sizes="48x48" />
<!-- Agar bisa dipasang sebagai aplikasi di HP -->
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../ikon/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Warung Go">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    --ink: #0d1a12; --amber: #f5a524; --krem: #f6f0e2;
    --wa: #25d366; --leaf: #3ba55d;
    /* Tema gelap: permukaan berundak + teks terang. Versi terang tiap aksen
       dipakai untuk TEKS, karena warna mentahnya gagal kontras 4,5:1. */
    --t1: #eef4ef; --t2: #a9bdb0; --t3: #82978a;
    --card: #14201a; --card-2: #1b2a21; --line: #27382e;
    --bg: #0b1410;
    --on-amber: #ffc65c; --on-leaf: #6ee08c; --on-merah: #ff9a9d;
    --r: 14px; --e: cubic-bezier(.22,1,.36,1);
    color-scheme: dark;
  }
  body {
    margin: 0; background: var(--bg); color: var(--t1);
    font-family: Inter, system-ui, sans-serif; font-size: 14.5px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  h1, h2, h3 { font-family: 'Bricolage Grotesque', sans-serif; margin: 0; letter-spacing: -.02em; line-height: 1.15; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 90px; }

  /* ── Kepala warung ── */
  .hero {
    background: linear-gradient(150deg, #1f3a28 0%, #0d1a12 100%);
    border-bottom: 1px solid rgba(245,165,36,.18);
    color: #fff; padding: 30px 24px 66px;
    padding-top: calc(30px + env(safe-area-inset-top, 0px));
    position: relative; overflow: hidden;
  }
  .hero::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(500px 300px at 15% 0%, rgba(245,165,36,.2), transparent 70%);
  }
  .hero__in { max-width: 720px; margin: 0 auto; position: relative; }
  /* Kilau amber tipis di sudut: memberi kedalaman, tidak mengganggu bacaan. */
  .hero::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(620px 320px at 88% -10%, rgba(245,165,36,.16), transparent 68%);
  }
  .hero__brand {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--amber); margin-bottom: 12px;
  }
  .hero h1 { font-size: 30px; font-weight: 800; }
  .hero__meta { color: #b6c6bc; font-size: 13px; margin-top: 7px; }
  .hero__badges { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 15px; }
  .pill {
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.16);
    padding: 5px 12px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .pill--amber { background: rgba(245,165,36,.2); border-color: rgba(245,165,36,.35); color: #ffd88a; }

  /* ── Kartu info ── */
  .kartu {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 20px; margin-top: -46px; position: relative; z-index: 2;
    box-shadow: 0 18px 44px -22px rgba(0,0,0,.95);
  }
  .kartu__row { display: flex; gap: 11px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 18px; border-radius: 11px; border: 1px solid var(--line);
    background: var(--card); font-size: 13.5px; font-weight: 700; cursor: pointer;
    text-decoration: none; color: inherit; transition: all .15s var(--e); flex: 1; min-width: 140px;
  }
  .btn:hover { transform: translateY(-1px); border-color: #3a5044; background: var(--card-2); }
  .btn--wa { background: var(--wa); border-color: var(--wa); color: #06301a; }
  .btn--ink { background: var(--krem); border-color: var(--krem); color: #0d1a12; }
  .btn svg { width: 17px; height: 17px; }

  /* ── Menu ── */
  .judul {
    display: flex; align-items: center; gap: 11px; margin: 30px 0 14px;
  }
  .judul h2 { font-size: 18px; }
  .judul span {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--t3);
    background: var(--card-2); padding: 3px 9px; border-radius: 999px;
  }
  .judul::after { content: ''; flex: 1; height: 1px; background: var(--line); }

  .item {
    display: flex; gap: 14px; padding: 14px; background: var(--card);
    border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 10px;
    transition: all .16s var(--e);
  }
  .item:hover { box-shadow: 0 10px 26px -14px rgba(0,0,0,.9); border-color: #35493d; transform: translateY(-1px); }
  /* Kemunculan berjenjang: elegan, dan langsung berhenti bila pengguna
     meminta lebih sedikit gerak. */
  @keyframes itemNaik { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .item { animation: itemNaik .5s cubic-bezier(.22,1,.36,1) both; }
  @media (prefers-reduced-motion: reduce) {
    .item { animation: none; }
    .item:hover { transform: none; }
  }
  .item__gambar {
    width: 62px; height: 62px; border-radius: 11px; flex: none;
    background: linear-gradient(140deg, #22342a, #182720);
    display: grid; place-items: center; overflow: hidden;
  }
  .item__gambar img { width: 100%; height: 100%; object-fit: cover; }
  .item__gambar svg { width: 24px; height: 24px; color: var(--t3); }
  .item__isi { flex: 1; min-width: 0; }
  .item__nama { font-weight: 700; font-size: 14.5px; font-family: 'Bricolage Grotesque', sans-serif; }
  .item__ket { font-size: 12.5px; color: var(--t2); margin-top: 2px; }
  .item__kanan { text-align: right; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; }
  .item__harga { font-weight: 800; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15.5px; white-space: nowrap; }
  .item__pesan {
    font-size: 11.5px; font-weight: 700; color: var(--wa); text-decoration: none;
    border: 1px solid rgba(37,211,102,.4); background: rgba(37,211,102,.1);
    padding: 4px 10px; border-radius: 999px; white-space: nowrap; margin-top: 7px;
    display: inline-flex; align-items: center; min-height: 34px;
  }

  .kosong { text-align: center; padding: 50px 20px; color: var(--t2); }
  .kosong svg { width: 40px; height: 40px; color: var(--t3); margin-bottom: 12px; }

  .foot {
    text-align: center; padding: 30px 20px; color: var(--t3); font-size: 11.5px;
    border-top: 1px solid var(--line); margin-top: 30px;
  }
  .foot b { color: var(--t2); font-family: 'JetBrains Mono', monospace; letter-spacing: .06em; }

  .wafloat {
    position: fixed; bottom: 18px; right: 18px; z-index: 50;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    background: var(--wa); color: #06301a; border-radius: 999px;
    padding: 13px 20px; font-weight: 700; font-size: 13.5px; text-decoration: none;
    display: flex; align-items: center; gap: 9px;
    box-shadow: 0 8px 26px rgba(37,211,102,.42);
  }
  .wafloat svg { width: 19px; height: 19px; }

  /* Area tekan lebih besar di perangkat sentuh */
  @media (pointer: coarse) {
    .btn { min-height: 46px; }
    .item__pesan { padding: 9px 14px; font-size: 12.5px; min-height: 40px; }
  }

  @media (max-width: 560px) {
    .hero h1 { font-size: 24px; }
    .hero { padding: 24px 18px 58px; padding-top: calc(24px + env(safe-area-inset-top, 0px)); }
    .kartu { padding: 16px; }
    .item { padding: 12px; gap: 11px; }
    .item__gambar { width: 52px; height: 52px; }
    .wafloat { left: 14px; right: 14px; justify-content: center; }
  }

  /* ── Tiga tab: Menu · Nilai · Bayar ── */
  .tabbar {
    display: flex; gap: 6px; background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px; margin: -34px auto 0; position: relative;
    z-index: 3; max-width: 420px; box-shadow: 0 14px 34px -18px rgba(0,0,0,.95);
  }
  .tabbtn {
    flex: 1; border: 0; background: transparent; padding: 10px 8px; border-radius: 999px;
    font: inherit; font-weight: 700; font-size: 13px; color: var(--t2); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 42px; transition: all .16s var(--e);
  }
  .tabbtn.on { background: var(--krem); color: #0d1a12; }
  .tabbtn__n {
    background: var(--amber); color: var(--ink); border-radius: 999px;
    font-size: 11px; font-weight: 800; padding: 1px 7px; min-width: 19px;
  }
  .tabbtn.on .tabbtn__n { background: #0d1a12; color: var(--krem); }
  [hidden] { display: none !important; }

  /* ── Rekomendasi terlaris ── */
  .laris {
    display: flex; gap: 11px; overflow-x: auto; padding: 3px 2px 9px;
    scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
  }
  .laris__kartu {
    flex: none; width: 148px; scroll-snap-align: start; background: var(--card);
    border: 1px solid var(--line); border-radius: var(--r); padding: 12px;
    position: relative;
  }
  .laris__kartu--juara { border-color: var(--amber); box-shadow: 0 4px 16px rgba(245,165,36,.2); }
  .laris__pita {
    position: absolute; top: -9px; left: 10px; background: var(--amber); color: var(--ink);
    font-size: 10px; font-weight: 800; padding: 3px 9px; border-radius: 999px;
    font-family: 'JetBrains Mono', monospace; letter-spacing: .04em;
  }
  .laris__nama { font-weight: 700; font-size: 13.5px; font-family: 'Bricolage Grotesque', sans-serif; line-height: 1.3; margin-top: 8px; }
  .laris__kaki { display: flex; align-items: center; justify-content: space-between; margin-top: 9px; gap: 6px; }
  .laris__harga { font-weight: 800; font-size: 14px; font-family: 'Bricolage Grotesque', sans-serif; }
  .laris__jual { font-size: 11px; color: var(--t3); }
  .laris__gambar {
    height: 74px; border-radius: 10px; background: linear-gradient(140deg, #22342a, #182720);
    display: grid; place-items: center; overflow: hidden;
  }
  .laris__gambar img { width: 100%; height: 100%; object-fit: cover; }
  .laris__gambar svg { width: 24px; height: 24px; color: var(--t3); }

  /* ── Tombol tambah & pengatur jumlah ── */
  .tambah {
    border: 1px solid var(--krem); background: var(--krem); color: #0d1a12; border-radius: 10px;
    width: 40px; height: 40px; font-size: 20px; font-weight: 700; line-height: 1;
    cursor: pointer; display: grid; place-items: center; flex: none;
  }
  .atur { display: flex; align-items: center; gap: 6px; }
  .atur button {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); font-size: 18px; font-weight: 700; cursor: pointer;
    display: grid; place-items: center; color: var(--t1);
  }
  .atur span { min-width: 20px; text-align: center; font-weight: 700; font-size: 14px; }

  /* ── Nilai (penilaian) ── */
  .nilai__kartu {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    padding: 14px; margin-bottom: 10px;
  }
  .bintang { display: flex; gap: 4px; }
  .bintang button {
    border: 0; background: transparent; font-size: 25px; line-height: 1; cursor: pointer;
    color: #3b5245; padding: 0; transition: transform .12s var(--e);
  }
  .bintang button.on { color: var(--amber); }
  .bintang button:active { transform: scale(1.2); }
  .rata { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; line-height: 1; }

  /* ── Keranjang & bayar ── */
  .kbaris {
    display: flex; align-items: center; gap: 12px; padding: 12px 0;
    border-bottom: 1px dashed var(--line);
  }
  .kbaris:last-child { border-bottom: 0; }
  .kbaris__isi { flex: 1; min-width: 0; }
  .kbaris__nama { font-weight: 700; font-size: 13.5px; }
  .kbaris__sub { font-size: 12px; color: var(--t3); }
  .total {
    display: flex; align-items: center; justify-content: space-between;
    padding: 15px 0 5px; margin-top: 5px; border-top: 2px solid var(--line);
  }
  .total__label { font-weight: 700; font-size: 14px; }
  .total__nilai { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; }
  .bidang { margin-bottom: 13px; }
  .bidang label { display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 6px; color: var(--t2); }
  .bidang input, .bidang textarea {
    width: 100%; padding: 12px 13px; border: 1px solid var(--line); border-radius: 11px;
    font: inherit; font-size: 14px; background: var(--card-2); color: var(--t1);
  }
  .bayar__tujuan {
    background: var(--card-2); border: 1px dashed var(--line); border-radius: var(--r);
    padding: 14px; margin: 12px 0;
  }
  .bayar__tujuan .baris { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 13.5px; }
  .bayar__tujuan .baris b { font-family: 'JetBrains Mono', monospace; }
  .hitung { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
  .hitung--awas { color: var(--on-merah); }

  .keranjangbar {
    position: fixed; left: 14px; right: 14px; z-index: 60;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(150deg, #1f3a28, #0d1a12); color: #fff;
    border: 1px solid rgba(245,165,36,.28);
    border-radius: 16px; padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 16px 40px -18px rgba(0,0,0,.95);
    max-width: 692px; margin: 0 auto;
  }
  .keranjangbar__info { flex: 1; min-width: 0; }
  .keranjangbar__info b { display: block; font-size: 12px; color: #b6c6bc; font-weight: 600; }
  .keranjangbar__info span { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 18px; }
  .keranjangbar button {
    background: var(--amber); color: var(--ink); border: 0; border-radius: 11px;
    padding: 12px 18px; font: inherit; font-weight: 800; font-size: 13.5px; cursor: pointer;
    white-space: nowrap;
  }
  .notis {
    display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r);
    font-size: 13px; margin-bottom: 12px;
  }
  .notis--kuning { background: rgba(245,165,36,.13); border: 1px solid rgba(245,165,36,.3); color: var(--on-amber); }
  .notis--hijau { background: rgba(59,165,93,.14); border: 1px solid rgba(59,165,93,.32); color: var(--on-leaf); }
  .notis--biru { background: rgba(59,130,246,.14); border: 1px solid rgba(59,130,246,.32); color: #8fbcff; }
  .notis svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }

  /* ── Percantik ──
     Latar diberi dua kilau tipis dan tiap kartu diberi garis cahaya di tepi
     atas, supaya bidang-bidang gelap tidak saling melebur. */
  body {
    background:
      radial-gradient(760px 420px at 12% -6%, rgba(245,165,36,.07), transparent 62%),
      radial-gradient(660px 420px at 100% 2%, rgba(59,165,93,.07), transparent 60%),
      var(--bg);
    background-repeat: no-repeat;
  }
  .kartu, .item, .laris__kartu, .nilai__kartu {
    background-image: linear-gradient(180deg, rgba(255,255,255,.03), transparent 46%);
  }
  .item { transition: border-color .16s var(--e), box-shadow .16s var(--e), transform .16s var(--e); }
</style>
</head>
<body>

<div class="hero">
  <div class="hero__in">
    <div class="hero__brand">Warung Go Digital</div>
    <h1 id="nama">Memuat menu…</h1>
    <div class="hero__meta" id="meta"></div>
    <div class="hero__badges" id="badges"></div>
  </div>
</div>

<div class="wrap">
  <div class="kartu">
    <div class="kartu__row">
      <a class="btn btn--wa" id="waPesan" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 01-12.6 7.4L3.5 20.5l1.7-4.8A8.5 8.5 0 1121 11.5z"/></svg>
        Pesan via WhatsApp
      </a>
      <a class="btn btn--ink" id="waMaps" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.5 7-11a7 7 0 10-14 0c0 5.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
        Lihat Lokasi
      </a>
    </div>
  </div>

  <div class="tabbar" id="tabbar" role="tablist">
    <button class="tabbtn on" data-tab="menu" role="tab">Menu</button>
    <button class="tabbtn" data-tab="nilai" role="tab">Nilai</button>
    <button class="tabbtn" data-tab="bayar" role="tab">
      Bayar<span class="tabbtn__n" id="nKeranjang" hidden>0</span>
    </button>
  </div>

  <section id="tabMenu">
    <div id="isiMenu"></div>
  </section>

  <section id="tabNilai" hidden></section>

  <section id="tabBayar" hidden></section>

  <div class="foot">
    Menu digital oleh <b>WARUNG GO DIGITAL</b><br>
    Etalase digital untuk warung &amp; UMKM
  </div>
</div>

<a class="wafloat" id="waFloat" href="#">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 01-12.6 7.4L3.5 20.5l1.7-4.8A8.5 8.5 0 1121 11.5z"/></svg>
  Pesan Sekarang
</a>

<div class="keranjangbar" id="keranjangbar" hidden>
  <div class="keranjangbar__info">
    <b id="kbJumlah">0 item</b>
    <span id="kbTotal">Rp 0</span>
  </div>
  <button id="kbBayar">Lanjut bayar</button>
</div>

<script src="store.js"></script>
<script src="../bersama/bunyi.js"></script>
<script src="../bersama/pesanan.js"></script>
<script src="menu.js"></script>
<script src="../pasang.js"></script>
</body>
</html>
