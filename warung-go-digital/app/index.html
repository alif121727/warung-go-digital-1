<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel Mitra — Warung Go Digital</title>
<meta name="description" content="Panel pengelolaan mitra Warung Go Digital: transaksi, rating Google Maps, katalog WhatsApp Business, promosi digital, foto produk, dan laporan bulanan.">
<meta name="theme-color" content="#0d1a12">
<meta name="robots" content="noindex, nofollow">
<!-- Alamat situs publik. Dipakai untuk menyusun tautan QR menu agar bisa
     dibuka HP pelanggan. Ubah bila situs dipasang di alamat lain. -->
<meta name="wgd-situs-publik" content="https://alif121727.github.io/warung-go-digital-1/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f5a524'/%3E%3Ctext x='16' y='23' font-size='18' font-weight='bold' text-anchor='middle' fill='%230d1a12' font-family='sans-serif'%3EW%3C/text%3E%3C/svg%3E">
<!-- Agar bisa dipasang sebagai aplikasi di HP -->
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../ikon/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Warung Go">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>

<div class="app">

  <!-- ═══ BILAH SISI ═══ -->
  <aside class="side">
    <div class="side__brand">
      <div class="side__logo">W</div>
      <div>
        <div class="side__name">Warung Go Digital</div>
        <div class="side__sub">Panel Mitra</div>
      </div>
    </div>

    <nav class="side__nav" id="nav"></nav>

    <div class="side__foot">
      <div class="side__user">
        <div class="side__ava">AD</div>
        <div style="min-width:0">
          <div class="side__uname">Admin Pengelola</div>
          <div class="side__urole">Akses penuh</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ═══ AREA UTAMA ═══ -->
  <div class="main">
    <header class="topbar">
      <button class="topbar__burger" id="burger" aria-label="Buka menu">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="topbar__title">
        <h1 id="judul">Ringkasan Usaha</h1>
        <div class="topbar__crumb" id="crumb">Utama / Dasbor</div>
      </div>
      <div class="topbar__spacer"></div>

      <div class="search">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="cari" placeholder="Cari warung, transaksi..." aria-label="Cari">
      </div>

      <button class="btn btn--sm" id="btnImpor" title="Pulihkan dari cadangan">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9M7 13l5-5 5 5"/><path d="M4 4h16"/></svg>
        <span class="nowrap">Pulihkan</span>
      </button>
      <input type="file" id="fileImpor" accept="application/json" hidden>

      <button class="btn btn--sm" id="btnEkspor" title="Unduh cadangan data">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>
        <span class="nowrap">Cadangan</span>
      </button>

      <button class="btn btn--sm btn--dgr" id="btnKosongkan" title="Hapus semua data">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
      </button>
    </header>

    <main class="view" id="view"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="modal" id="modal"></div>
<div class="drawer" id="drawer"></div>
<div class="toasts" id="toasts"></div>

<script src="qr.js"></script>
<script src="terbit.js"></script>
<script src="store.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
<script src="modul-transaksi.js"></script>
<script src="modul-rating.js"></script>
<script src="modul-katalog.js"></script>
<script src="modul-promosi.js"></script>
<script src="modul-foto.js"></script>
<script src="modul-laporan.js"></script>
<script src="../pasang.js"></script>
</body>
</html>
