name: Bangun APK Android

# Membangun APK (aplikasi mandiri, tanpa membuka Chrome) memakai Capacitor,
# lalu melampirkannya ke GitHub Release sebagai tautan unduh.
#
# Runner ubuntu-latest sudah menyertakan Java dan Android SDK, sehingga
# pembangunan tidak perlu dilakukan di komputer lokal.

on:
  push:
    branches: [main]
    paths:
      - 'warung-go-digital/pemilik/**'
      - 'warung-go-digital/admin/**'
      - 'warung-go-digital/bersama/**'
      - 'warung-go-digital/ikon/**'
      - 'apk/**'
      - '.github/workflows/bangun-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    # Runner ubuntu-latest sudah menyertakan Android SDK di lokasi ini.
    # Action android-actions/setup-android sengaja TIDAK dipakai: pada runner ini
    # ia gagal ("Wrong version in preinstalled sdkmanager") dan tidak diperlukan.
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Capacitor 8 menuntut Node 22+ (engines: node >=22).
          node-version: '22'

      # Capacitor 8 memakai Gradle 8.14 dengan AGP 8.13, yang menargetkan
      # Java 21 (lihat capacitor.build.gradle). Java 17 akan gagal dengan
      # "invalid source release: 21".
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Pasang Pillow (untuk ikon)
        run: python3 -m pip install pillow

      - name: Siapkan berkas web
        run: node apk/siapkan.mjs

      - name: Pasang dependensi Capacitor
        working-directory: apk
        run: npm install --no-audit --no-fund

      - name: Tambahkan platform Android
        working-directory: apk
        run: npx cap add android

      - name: Pasang ikon & splash aplikasi
        run: python3 apk/siapkan-aset-android.py

      - name: Sesuaikan AndroidManifest (izin lokasi)
        run: python3 apk/siapkan-manifest-android.py

      - name: Samakan versi Android dengan package.json
        run: python3 apk/setel-versi-android.py

      - name: Selaraskan berkas web ke Android
        working-directory: apk
        run: npx cap sync android

      - name: Bangun APK (unduh langsung) & AAB (Play Store)
        working-directory: apk/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          chmod +x gradlew
          mkdir -p ../../hasil

          # Tanda tangan dilakukan dengan apksigner/jarsigner (bukan konfigurasi
          # Gradle) agar hasilnya pasti: Gradle menghasilkan berkas tanpa tanda
          # tangan, lalu kita tandatangani sendiri dengan kunci rilis.
          if [ -n "$KS_B64" ]; then
            echo "Kunci rilis ditemukan — APK & AAB akan bertanda tangan rilis."
            echo "$KS_B64" | base64 -d > keystore.jks
            ./gradlew assembleRelease bundleRelease --no-daemon

            TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            echo "Memakai build-tools: $TOOLS"

            # APK: sejajarkan lalu tandatangani dengan apksigner.
            "$TOOLS/zipalign" -f 4 \
              app/build/outputs/apk/release/app-release-unsigned.apk \
              ../../hasil/warung-go-digital.apk
            "$TOOLS/apksigner" sign \
              --ks keystore.jks \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KS_PASS" \
              --key-pass "pass:$KEY_PASS" \
              --out ../../hasil/warung-go-digital.apk \
              ../../hasil/warung-go-digital.apk
            "$TOOLS/apksigner" verify --print-certs ../../hasil/warung-go-digital.apk

            # AAB untuk Google Play: berkas ini berbentuk arsip, jadi
            # ditandatangani dengan jarsigner (cara resmi Google Play).
            cp app/build/outputs/bundle/release/app-release.aab \
              ../../hasil/warung-go-digital.aab
            jarsigner -verbose \
              -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore keystore.jks \
              -storepass "$KS_PASS" \
              -keypass "$KEY_PASS" \
              ../../hasil/warung-go-digital.aab "$KEY_ALIAS"
            jarsigner -verify -verbose -certs ../../hasil/warung-go-digital.aab \
              | tail -3
            rm -f keystore.jks
          else
            echo "::warning::Kunci rilis belum diatur. APK memakai tanda tangan debug,"
            echo "::warning::sehingga Android menampilkan peringatan saat pemasangan."
            echo "::warning::AAB tidak dibuat karena Play Store wajib memakai kunci rilis."
            echo "::warning::Ikuti apk/buat-kunci.sh lalu isi 4 rahasia ANDROID_* di repo."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../../hasil/warung-go-digital.apk
          fi

          ls -lh ../../hasil/

      - name: Unggah sebagai artefak
        uses: actions/upload-artifact@v4
        with:
          name: warung-go-digital-apk
          path: |
            hasil/warung-go-digital.apk
            hasil/warung-go-digital.aab
          if-no-files-found: error

      - name: Cek rilis (rilis lama bersifat tetap/tidak bisa ditimpa)
        id: rilis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Rilis yang sudah ada (dan immutable) tidak bisa ditimpa GitHub.
          # Bila aset sudah ada, lewati langkah lampirkan agar alur kerja tidak
          # merah; untuk menerbitkan APK baru, naikkan tag_name.
          if gh release view v1.2.0 --repo "$GITHUB_REPOSITORY" --json assets \
               --jq '.assets[].name' 2>/dev/null | grep -qx 'warung-go-digital.apk'; then
            echo "ada=true" >> "$GITHUB_OUTPUT"
            echo "Rilis v1.2.0 sudah punya APK. Langkah lampirkan dilewati."
          else
            echo "ada=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lampirkan ke Release (tautan unduh tetap)
        if: steps.rilis.outputs.ada != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: Warung Go Digital 1.2.0
          body: |
            Aplikasi Android Warung Go Digital — dapat dipasang langsung di HP.

            Berisi dua aplikasi dalam satu pemasangan:
            - Aplikasi Warung (pemilik): catat penjualan, pendapatan, dan lokasi jualan harian.
            - Panel Pengelola: rekap penjualan, pendapatan, dan lokasi seluruh mitra.

            Keduanya berfungsi tanpa internet dan tidak membuka peramban.

            Versi 1.2.0 memperbaiki perilaku di dalam aplikasi:
            - Tombol kembali HP: menutup dialog → pindah ke tab pertama → keluar.
            - Unduh berkas (CSV, cadangan JSON, poster) kini benar-benar
              tersimpan di perangkat, lalu muncul menu Bagikan Android.
            - Ikon adaptif, ikon bulat, dan splash screen baru bermerek.

            Tersedia berkas:
            - warung-go-digital.apk — pasang langsung di HP Android.
            - warung-go-digital.aab — untuk diunggah ke Google Play Store.
              Hanya dibuat bila rahasia kunci rilis (ANDROID_*) sudah diisi;
              lihat PANDUAN-PLAY-STORE.md.

            Cara memasang: unduh berkas APK di bawah, lalu buka di HP Android dan
            izinkan pemasangan dari sumber ini bila diminta.
          files: |
            hasil/warung-go-digital.apk
            hasil/warung-go-digital.aab
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
