name: Bangun APK Android

# Membangun APK (aplikasi mandiri, tanpa membuka Chrome) memakai Capacitor,
# lalu melampirkannya ke GitHub Release sebagai tautan unduh.
#
# Runner ubuntu-latest sudah menyertakan Java dan Android SDK, sehingga
# pembangunan tidak perlu dilakukan di komputer lokal.

on:
  push:
    branches: [main]
    paths:
      - 'warung-go-digital/pemilik/**'
      - 'warung-go-digital/admin/**'
      - 'warung-go-digital/bersama/**'
      - 'warung-go-digital/ikon/**'
      - 'apk/**'
      - '.github/workflows/bangun-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    # Runner ubuntu-latest sudah menyertakan Android SDK di lokasi ini.
    # Action android-actions/setup-android sengaja TIDAK dipakai: pada runner ini
    # ia gagal ("Wrong version in preinstalled sdkmanager") dan tidak diperlukan.
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Capacitor 6 memakai Gradle 8.2, yang belum mendukung Java 21. Pakai 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang Pillow (untuk ikon)
        run: python3 -m pip install pillow

      - name: Siapkan berkas web
        run: node apk/siapkan.mjs

      - name: Pasang dependensi Capacitor
        working-directory: apk
        run: npm install --no-audit --no-fund

      - name: Tambahkan platform Android
        working-directory: apk
        run: npx cap add android

      - name: Pasang ikon aplikasi
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import shutil

          res = Path('apk/android/app/src/main/res')
          dasar = Image.open('warung-go-digital/ikon/ikon-maskable-512.png').convert('RGBA')
          ikon = dasar.resize((1024, 1024), Image.LANCZOS)

          # Ikon adaptif bawaan Capacitor menunjuk ke gambar contohnya sendiri.
          # Hapus supaya Android memakai ic_launcher.png milik kita.
          for d in res.glob('mipmap-anydpi-v26'):
              shutil.rmtree(d, ignore_errors=True)

          ukuran = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          n = 0
          for nama, px in ukuran.items():
              folder = res / f'mipmap-{nama}'
              if not folder.exists():
                  continue
              gambar = ikon.resize((px, px), Image.LANCZOS)
              for berkas in ('ic_launcher.png', 'ic_launcher_round.png'):
                  gambar.save(folder / berkas, 'PNG', optimize=True)
                  n += 1
          print(f'ikon diganti: {n} berkas')
          PY

      - name: Selaraskan berkas web ke Android
        working-directory: apk
        run: npx cap sync android

      - name: Bangun APK
        working-directory: apk/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          chmod +x gradlew
          mkdir -p ../../hasil

          # Tanda tangan dilakukan dengan apksigner (bukan konfigurasi Gradle)
          # agar hasilnya pasti: assembleRelease menghasilkan APK tanpa tanda
          # tangan, lalu kita tandatangani sendiri dengan kunci rilis.
          if [ -n "$KS_B64" ]; then
            echo "Kunci rilis ditemukan — APK akan bertanda tangan rilis."
            echo "$KS_B64" | base64 -d > keystore.jks
            ./gradlew assembleRelease --no-daemon

            TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            echo "Memakai build-tools: $TOOLS"
            "$TOOLS/zipalign" -f 4 \
              app/build/outputs/apk/release/app-release-unsigned.apk \
              ../../hasil/warung-go-digital.apk
            "$TOOLS/apksigner" sign \
              --ks keystore.jks \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KS_PASS" \
              --key-pass "pass:$KEY_PASS" \
              --out ../../hasil/warung-go-digital.apk \
              ../../hasil/warung-go-digital.apk
            "$TOOLS/apksigner" verify --print-certs ../../hasil/warung-go-digital.apk
            rm -f keystore.jks
          else
            echo "::warning::Kunci rilis belum diatur. APK memakai tanda tangan debug,"
            echo "::warning::sehingga Android menampilkan peringatan saat pemasangan."
            echo "::warning::Ikuti apk/buat-kunci.sh lalu isi 4 rahasia ANDROID_* di repo."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../../hasil/warung-go-digital.apk
          fi

          ls -lh ../../hasil/

      - name: Unggah sebagai artefak
        uses: actions/upload-artifact@v4
        with:
          name: warung-go-digital-apk
          path: hasil/warung-go-digital.apk
          if-no-files-found: error

      - name: Cek rilis (rilis lama bersifat tetap/tidak bisa ditimpa)
        id: rilis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Rilis yang sudah ada (dan immutable) tidak bisa ditimpa GitHub.
          # Bila aset sudah ada, lewati langkah lampirkan agar alur kerja tidak
          # merah; untuk menerbitkan APK baru, naikkan tag_name.
          if gh release view v1.1.0 --repo "$GITHUB_REPOSITORY" --json assets \
               --jq '.assets[].name' 2>/dev/null | grep -qx 'warung-go-digital.apk'; then
            echo "ada=true" >> "$GITHUB_OUTPUT"
            echo "Rilis v1.1.0 sudah punya APK. Langkah lampirkan dilewati."
          else
            echo "ada=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lampirkan ke Release (tautan unduh tetap)
        if: steps.rilis.outputs.ada != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Warung Go Digital 1.1.0
          body: |
            Aplikasi Android Warung Go Digital — dapat dipasang langsung di HP.

            Berisi dua aplikasi dalam satu pemasangan:
            - Aplikasi Warung (pemilik): catat penjualan, pendapatan, dan lokasi jualan harian.
            - Panel Pengelola: rekap penjualan, pendapatan, dan lokasi seluruh mitra.

            Keduanya berfungsi tanpa internet dan tidak membuka peramban.
            Versi 1.1.0 menambah tab Sinkron untuk mengirim laporan otomatis
            ke server pengelola (opsional; tanpa itu, kirim manual tetap ada).

            Cara memasang: unduh berkas APK di bawah, lalu buka di HP Android dan
            izinkan pemasangan dari sumber ini bila diminta.
          files: hasil/warung-go-digital.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
