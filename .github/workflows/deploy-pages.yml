name: Deploy ke GitHub Pages

# Jalankan saat ada push ke cabang utama, atau lewat tombol "Run workflow".
on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Hanya satu deploy berjalan; yang baru menggantikan yang belum selesai.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Situs ada di dalam folder warung-go-digital/, sedangkan GitHub Pages
      # menyajikan dari akar. Jadi isinya disalin ke _site/ lebih dulu.
      - name: Susun situs
        run: |
          mkdir -p _site
          cp -R warung-go-digital/. _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
