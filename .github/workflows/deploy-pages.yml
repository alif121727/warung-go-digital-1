name: Deploy ke GitHub Pages

# Jalankan saat ada push ke cabang utama, atau lewat tombol "Run workflow".
on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Hanya satu deploy berjalan; yang baru menggantikan yang belum selesai.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pages harus sudah dinyalakan sekali lewat Settings → Pages → Source:
      # "GitHub Actions". Opsi enablement sengaja TIDAK dipakai: ia menuntut
      # token selain GITHUB_TOKEN (PAT atau GitHub App dengan pages:write),
      # dan tanpa itu langkah ini gagal "Resource not accessible".
      - uses: actions/configure-pages@v6

      # Situs ada di dalam folder warung-go-digital/, sedangkan GitHub Pages
      # menyajikan dari akar. Jadi isinya disalin ke _site/ lebih dulu.
      - name: Susun situs
        run: |
          mkdir -p _site
          cp -R warung-go-digital/. _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # Berkas titik (termasuk .nojekyll) tidak disertakan secara bawaan.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
